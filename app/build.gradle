plugins {
    id 'com.android.application'
}

// Release signing is optional. Put the values in ~/.gradle/gradle.properties,
// never in this project. Without them, the release build is left unsigned.
def releaseKeystore = findProperty('CC_KEYSTORE')

android {
    namespace 'com.cryptcage'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cryptcage'
        minSdk 21
        targetSdk 34
        versionCode 25
        versionName '2.2'
    }

    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword findProperty('CC_STORE_PASS')
                keyAlias findProperty('CC_KEY_ALIAS')
                keyPassword findProperty('CC_KEY_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-project.txt'
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
    // 7z export. xz is needed by the writer even for uncompressed entries.
    implementation 'org.apache.commons:commons-compress:1.26.1'
    implementation 'org.tukaani:xz:1.10'

    testImplementation 'junit:junit:4.13.2'
}
